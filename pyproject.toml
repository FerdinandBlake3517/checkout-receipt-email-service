[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkout-receipt-email-service"
version = "0.1.0"
description = "Typed Python service for checkout receipts and fulfillment email updates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic[email]>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/order_email_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
